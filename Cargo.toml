[package]
name = "advanced-tiny-sysmon"
version = "0.1.0"
edition = "2024"
description = "Tiny, fast, low-overhead Rust system monitoring daemon exposing metrics to RAM-backed files for status bars and consumers"
license = "MIT"

[[bin]]
name = "atsm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
